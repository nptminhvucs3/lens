<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thử lens ảo – nhận diện mắt tự động</title>
<style>
:root{--bg:#faf7f5;--fg:#2a2423;--mut:#7a6f6c;--card:#fff;--line:#e6dedb}
@media (prefers-color-scheme:dark){:root{--bg:#1c1918;--fg:#f1eae7;--mut:#a89d99;--card:#262221;--line:#3a3433}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0}p{margin:0 0 12px;color:var(--mut);font-size:13px}
#stage{position:relative;margin:0 auto;width:min(100%,calc(78vh*var(--ar,1.3333)));aspect-ratio:var(--ar,1.3333);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer}
.pri{background:var(--fg);color:var(--bg)}.on{outline:2px solid var(--fg)}.sw{width:34px;height:34px;padding:0;border-radius:50%}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}input[type=range]{width:100%}#msg{font-size:13px;color:var(--mut);min-height:40px;margin-top:8px}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none}
</style></head><body><div class="w">
<h1>Thử lens ảo</h1><p>Mắt được nhận diện tự động. Mở camera hoặc tải ảnh chính diện rõ mắt.</p>
<div id="stage"><canvas id="cv" width="720" height="540"></canvas><video id="vd" playsinline muted></video></div>
<div id="msg"></div>
<div class="row"><button id="cam" class="pri">Mở camera</button><label class="btn" style="margin:0">Tải ảnh lên<input id="fi" type="file" accept="image/*" hidden></label></div>
<label>Chọn mẫu lens</label><div class="row" id="lenses"></div><div class="row"><label class="btn" style="margin:0">Thêm lens của bạn (ảnh nền đen)<input id="lf" type="file" accept="image/*" hidden></label></div><label>Đổi màu mẫu đang chọn</label><div class="row" id="cols"></div>
<label>Độ đậm màu <input id="al" type="range" min="20" max="100" value="100"></label>

<label>Làm đẹp da</label><div class="row"><button id="beOn" class="on">Bật</button><button class="bp" data-p="0.3,0.3">Tự nhiên</button><button class="bp" data-p="0.2,0.2">Nhẹ</button><button class="bp" data-p="0.55,0.55">Rõ nét</button><button id="beRst">Hình gốc</button></div>
<label>Độ mịn da <input id="beSm" type="range" min="0" max="100" value="30"></label><label>Mức làm đẹp tổng thể <input id="beLv" type="range" min="0" max="100" value="30"></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="denOn" checked> Giảm nhiễu camera</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rawOn"> Xem camera gốc (không xử lý) để so sánh</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="showpts"> Hiện điểm nhận diện (để kiểm tra)</label></div>
