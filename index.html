<style>
:root{--bg:#faf7f5;--fg:#2a2423;--mut:#7a6f6c;--card:#fff;--line:#e6dedb}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

function rgb(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0)*255,f(8)*255,f(4)*255]}
function build(){const N=256,o=document.createElement('canvas');o.width=o.height=N;const c=o.getContext('2d');c.drawImage(src,0,0,N,N);const im=c.getImageData(0,0,N,N),d=im.data;
for(let i=0;i<d.length;i+=4){const x=(i/4)%N-N/2,y=Math.floor(i/4/N)-N/2,r=Math.hypot(x,y)/(N/2);let R=d[i],G=d[i+1],B=d[i+2];
if(cur.h!==null){const[h,s,l]=hsl(R,G,B),q=rgb(cur.h,cur.s===0?0:Math.max(s,cur.s),l);R=q[0];G=q[1];B=q[2]}
let a=Math.min(1,Math.max(d[i],d[i+1],d[i+2])/255*1.8);if(r>1)a=0;d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=a*255}
c.putImageData(im,0,0);const s=document.createElement('canvas');s.width=s.height=36;const sx=s.getContext('2d');sx.imageSmoothingQuality='high';sx.drawImage(o,0,0,36,36);
const o2=document.createElement('canvas');o2.width=o2.height=128;const c2=o2.getContext('2d');c2.imageSmoothingQuality='high';c2.drawImage(s,0,0,128,128);
const i2=c2.getImageData(0,0,128,128),e=i2.data;for(let i=0;i<e.length;i+=4){const x=(i/4)%128-64,y=Math.floor(i/4/128)-64,r=Math.hypot(x,y)/64;let a=Math.min(1,e[i+3]/255*2.4);if(r>.84)a*=Math.max(0,(1-r)/.16);e[i+3]=a*255}
c2.putImageData(i2,0,0);tl=o2;redraw()}
function render(s,res,mirror){const W=cv.width,H=cv.height;ctx.save();ctx.clearRect(0,0,W,H);if(mirror){ctx.translate(W,0);ctx.scale(-1,1)}
ctx.drawImage(s,0,0,W,H);const f=res&&res.faceLandmarks&&res.faceLandmarks[0];
if(f&&tl)EY.forEach(e=>{const p=f[e.c[0]];let r=0;for(let k=1;k<5;k++)r+=Math.hypot((f[e.c[k]].x-p.x)*W,(f[e.c[k]].y-p.y)*H);r/=4;const d=2*r*sc;
ctx.save();ctx.beginPath();e.o.forEach((n,i)=>{const q=f[n];i?ctx.lineTo(q.x*W,q.y*H):ctx.moveTo(q.x*W,q.y*H)});ctx.closePath();ctx.clip();
ctx.globalAlpha=alpha;ctx.drawImage(tl,p.x*W-d/2,p.y*H-d/2,d,d);ctx.restore()});ctx.restore()}
function redraw(){if(lastSrc)render(lastSrc,lastRes,mode==='cam')}
async function init(){try{msg.textContent='Đang tải công cụ nhận diện mắt…';const B='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const mp=await import(B+'/vision_bundle.mjs');const fs=await mp.FilesetResolver.forVisionTasks(B+'/wasm');
const M='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const mk=d=>mp.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M,delegate:d},runningMode:'IMAGE',numFaces:1});
try{lm=await mk('GPU')}catch(e){lm=await mk('CPU')}msg.textContent='Sẵn sàng. Mở camera hoặc tải ảnh lên.'}catch(e){msg.textContent='Không tải được công cụ nhận diện. Cần có internet và mở trang qua https.'}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cam').textContent='Mở camera';mode='img'}
function loop(){if(mode!=='cam'||!stream)return;if(vd.currentTime!==lt){lt=vd.currentTime;lastSrc=vd;lastRes=lm.detectForVideo(vd,performance.now());render(vd,lastRes,true)}requestAnimationFrame(loop)}
$('cam').onclick=async()=>{if(stream){stopCam();return}if(!lm){msg.textContent='Công cụ nhận diện chưa sẵn sàng.';return}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false});vd.srcObject=stream;await vd.play();await lm.setOptions({runningMode:'VIDEO'});
const W=Math.min(720,vd.videoWidth);cv.width=W;cv.height=Math.round(W*vd.videoHeight/vd.videoWidth);mode='cam';$('cam').textContent='Tắt camera';msg.textContent='';loop()}catch(e){stopCam();msg.textContent='Không mở được camera (cần cho phép camera và chạy qua https).'}};
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!lm){msg.textContent='Công cụ nhận diện chưa sẵn sàng.';return}stopCam();const im=new Image();
im.onload=async()=>{const W=Math.min(720,im.width);cv.width=W;cv.height=Math.round(W*im.height/im.width);await lm.setOptions({runningMode:'IMAGE'});lastSrc=im;lastRes=lm.detect(im);
msg.textContent=lastRes.faceLandmarks.length?'':'Không thấy khuôn mặt. Hãy dùng ảnh chính diện, rõ mắt.';redraw()};im.src=URL.createObjectURL(f)};
P.forEach((p,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=p.c;b.onclick=()=>{cur=p;[...$('cols').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');build()};$('cols').appendChild(b)});
$('al').oninput=e=>{alpha=e.target.value/100;redraw()};$('sc').oninput=e=>{sc=e.target.value/100;redraw()};
ctx.fillStyle='#d9cfcb';ctx.fillRect(0,0,720,540);ctx.fillStyle='#6b5f5b';ctx.font='28px system-ui';ctx.textAlign='center';ctx.fillText('Mở camera hoặc tải ảnh lên',360,270);
src.onload=build;src.src=SRC;init();
</script></body></html>
