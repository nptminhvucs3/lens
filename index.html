<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact Lens Try-On – demo</title>
<link rel="stylesheet" href="tryon.css">
<style>body{margin:0;padding:12px;font-family:system-ui,sans-serif}</style></head>
<body>
<div class="cltryon" id="cltryon-root" data-cltryon="boot"><div class="cltryon__boot">Đang tải…</div></div>
<script>
fetch('products.json').then(r=>r.json()).then(data=>{
  const d=document.createElement('script'); d.type='application/json'; d.id='cltryon-data';
  d.textContent=JSON.stringify(data); document.getElementById('cltryon-root').appendChild(d);
  window.CLTRYON_ENV={vendorUrl:new URL('vendor/',location.href).href,choices:{
    color:{brown:'Nâu',gray:'Xám',blue:'Xanh dương',green:'Xanh lá',black:'Đen',olive:'Olive',other:'Khác'},
    style:{natural:'Natural – tự nhiên',sweet:'Sweet – dịu dàng',clear:'Clear – trong trẻo',western:'Western – mắt sáng, nổi bật',glam:'Glam – nổi bật, cá tính'},
    dilation:{none:'Không giãn tròng',slight:'Giãn nhẹ',clear:'Giãn rõ'},border:{with:'Có viền',without:'Không viền'},
    usage:{daily:'Dùng hàng ngày',makeup:'Trang điểm / chụp ảnh'}},
    notice:'Hình ảnh thử lens chỉ mang tính tham khảo thẩm mỹ, không phải tư vấn y khoa.',care:'',strings:{}};
  const s=document.createElement('script'); s.src='tryon.js'; document.body.appendChild(s);
});
</script></body></html>
